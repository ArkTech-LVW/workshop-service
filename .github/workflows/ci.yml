name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: ./gradlew build | tee "$RUNNER_TEMP/gradle.log"

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html

      - name: Publish coverage summary
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          csv=build/reports/jacoco/test/jacocoTestReport.csv
          [ -f "$csv" ] || exit 0
          minimum=$(sed -n 's/^coverageLineMinimum=//p' gradle.properties | tr -d '\r')
          marker='<!-- coverage-report -->'
          body="$RUNNER_TEMP/coverage.md"

          rows=$(awk -F, 'NR > 1 {
              split($2, pkg, ".")
              if (pkg[6] == "domain" || pkg[6] == "application") { missed[pkg[5]] += $8; covered[pkg[5]] += $9 }
            }
            END {
              for (module in covered) {
                lines = missed[module] + covered[module]
                if (lines > 0) printf "| %s | %d | %.1f%% |\n", module, lines, 100 * covered[module] / lines
              }
            }' "$csv" | sort)

          read -r scope_pct scope_lines project_pct status < <(awk -F, -v minimum="$minimum" 'NR > 1 {
              split($2, pkg, ".")
              all_missed += $8; all_covered += $9
              if (pkg[6] == "domain" || pkg[6] == "application") { scope_missed += $8; scope_covered += $9 }
            }
            END {
              scope = scope_missed + scope_covered
              ratio = scope ? scope_covered / scope : 1
              printf "%.1f %d %.1f %s\n", 100 * ratio, scope, 100 * all_covered / (all_missed + all_covered), (ratio >= minimum ? "✅" : "❌")
            }' "$csv")

          {
            echo "$marker"
            echo "### Cobertura de testes no commit ${COMMIT_SHA:0:7}"
            echo
            echo "Regra: linhas de \`domain\` e \`application\` de todos os módulos, mínimo $(awk -v m="$minimum" 'BEGIN { printf "%d", m * 100 }')%."
            echo
            echo "| Módulo | Linhas | Cobertura |"
            echo "|---|---|---|"
            echo "$rows"
            echo "| **Escopo da regra** | **$scope_lines** | **$scope_pct%** $status |"
            echo
            echo "Projeto inteiro: $project_pct% das linhas."
            echo
            echo "[Relatório completo no artefato \`coverage-report\`]($RUN_URL)"
          } > "$body"

          cat "$body" >> "$GITHUB_STEP_SUMMARY"

          [ "$EVENT_NAME" = "pull_request" ] || exit 0
          comment_id=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" -F body=@"$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file "$body"
          fi

      - name: Comment failed tests on PR
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          log="$RUNNER_TEMP/gradle.log"
          summary=$(grep -m1 -E '^Tests: .*, [1-9][0-9]* failed' "$log") || exit 0
          {
            echo "### ❌ Testes falharam no commit ${HEAD_SHA:0:7}"
            echo
            echo "\`$summary\`"
            echo
            grep -E '^[A-Za-z].* > .* FAILED$' "$log" | sed -E 's/ FAILED$//; s/.*/- `&`/' | head -n 20
            echo
            echo "[Ver o log da execução]($RUN_URL)"
          } | gh pr comment "$PR_NUMBER" --body-file -
