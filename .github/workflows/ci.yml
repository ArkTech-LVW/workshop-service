name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: ./gradlew build | tee "$RUNNER_TEMP/gradle.log"

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html

      - name: Comment failed tests on PR
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          log="$RUNNER_TEMP/gradle.log"
          summary=$(grep -m1 -E '^Tests: .*, [1-9][0-9]* failed' "$log") || exit 0
          {
            echo "### ❌ Testes falharam no commit ${HEAD_SHA:0:7}"
            echo
            echo "\`$summary\`"
            echo
            grep -E '^[A-Za-z].* > .* FAILED$' "$log" | sed -E 's/ FAILED$//; s/.*/- `&`/' | head -n 20
            echo
            echo "[Ver o log da execução]($RUN_URL)"
          } | gh pr comment "$PR_NUMBER" --body-file -
