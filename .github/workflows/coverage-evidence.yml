name: Coverage evidence

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: ./gradlew build

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html

      - name: Commit evidence to a new branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          dir=docs/evidencias/cobertura
          reports=build/reports/jacoco/test
          generated_at=$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')
          branch="chore/coverage-evidence-$(TZ=America/Sao_Paulo date +%F)-run$GITHUB_RUN_NUMBER"

          mkdir -p "$dir"
          cp "$reports/jacocoTestReport.csv" "$dir/jacocoTestReport.csv"
          {
            echo "# Evidência de cobertura de testes"
            echo
            echo "Gerada em $generated_at (horário de Brasília) pelo workflow [Coverage evidence]($RUN_URL), a partir do commit [\`${SOURCE_SHA:0:7}\`]($SERVER_URL/$GH_REPO/commit/$SOURCE_SHA) da branch \`$SOURCE_REF\`."
            echo
            cat "$reports/coverage-summary.md"
            echo
            echo "A cobertura por classe está em [jacocoTestReport.csv](jacocoTestReport.csv). Para gerar uma evidência nova, rode o workflow Coverage evidence na aba Actions."
          } > "$dir/README.md"

          gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$SOURCE_SHA" > /dev/null

          jq -n \
            --arg repo "$GH_REPO" \
            --arg branch "$branch" \
            --arg head "$SOURCE_SHA" \
            --arg body "Source: $SOURCE_SHA ($SOURCE_REF)"$'\n'"Run: $RUN_URL" \
            --arg readme "$(base64 -w0 "$dir/README.md")" \
            --arg csv "$(base64 -w0 "$dir/jacocoTestReport.csv")" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: "docs(coverage): update coverage evidence", body: $body },
                fileChanges: { additions: [
                  { path: "docs/evidencias/cobertura/README.md", contents: $readme },
                  { path: "docs/evidencias/cobertura/jacocoTestReport.csv", contents: $csv }
                ] }
              } }
            }' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.url' > "$RUNNER_TEMP/commit-url"

          {
            cat "$dir/README.md"
            echo
            echo "---"
            echo
            echo "Commit assinado: $(cat "$RUNNER_TEMP/commit-url")"
            echo
            echo "**[Abrir o PR com a evidência]($SERVER_URL/$GH_REPO/compare/$SOURCE_REF...$branch?expand=1)**"
          } >> "$GITHUB_STEP_SUMMARY"
