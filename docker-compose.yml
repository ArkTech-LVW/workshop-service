services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: ${DB_USERNAME:-workshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workshop}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/workshop
      DB_USERNAME: ${DB_USERNAME:-workshop}
      DB_PASSWORD: ${DB_PASSWORD:-workshop}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
