services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: ${DB_USERNAME:-workshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workshop}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
