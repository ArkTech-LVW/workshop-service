spring:
  application:
    name: workshop-service
  profiles:
    active: development
  web:
    locale: pt_BR
    locale-resolver: fixed
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workshop}
    username: ${DB_USERNAME:workshop}
    password: ${DB_PASSWORD:workshop}
  # bootRun starts only the database; the app service in docker-compose.yml would clash on port 8080
  docker:
    compose:
      start:
        arguments: postgres
      stop:
        arguments: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
