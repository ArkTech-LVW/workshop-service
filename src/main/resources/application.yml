spring:
  application:
    name: workshop-service
  web:
    locale: pt_BR
    locale-resolver: fixed
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workshop}
    username: ${DB_USERNAME:workshop}
    password: ${DB_PASSWORD:workshop}
  # bootRun starts only the database; the app service in docker-compose.yml would clash on port 8080
  docker:
    compose:
      start:
        arguments: postgres
      stop:
        arguments: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-not-for-production-use}
    expiration: PT1H

springdoc:
  api-docs:
    path: /docs/openapi.json
    # Resolves ${...} in @Schema too (DTO fields), not only in @Operation, @Parameter and @Tag
    resolve-schema-properties: true
  swagger-ui:
    path: /docs
  # Error responses come from OpenApiConfig (global 500) and from each controller, not from the advice handlers
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
