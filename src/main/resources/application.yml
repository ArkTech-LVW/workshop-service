spring:
  application:
    name: workshop-service
  profiles:
    active: development
  web:
    locale: pt_BR
    locale-resolver: fixed
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workshop}
    username: ${DB_USERNAME:workshop}
    password: ${DB_PASSWORD:workshop}
  # bootRun starts only the database; the app service in docker-compose.yml would clash on port 8080
  docker:
    compose:
      start:
        arguments: postgres
      stop:
        arguments: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    out-of-order: true
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 500
      shutdown:
        await-termination: true
        await-termination-period: PT10S

server:
  port: 8080
  forward-headers-strategy: native

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: PT1H
  rate-limit:
    general:
      capacity: 100
      period: PT1M
    login-per-email-and-ip:
      capacity: 5
      period: PT1M
    routes:
      login:
        method: POST
        path: /auth/login
        capacity: 20
        period: PT1M
      customer-service-orders:
        path: /customer/serviceOrders/**
        capacity: 20
        period: PT1M

inventory:
  stock-reservation:
    validity: P7D

springdoc:
  api-docs:
    path: /docs/openapi.json
    # Resolves ${...} in @Schema too (DTO fields), not only in @Operation, @Parameter and @Tag
    resolve-schema-properties: true
  swagger-ui:
    path: /docs
  # Error responses come from OpenApiConfig (global 500) and from each controller, not from the advice handlers
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
