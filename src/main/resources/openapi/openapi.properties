# Peças e insumos
openapi.part.tag=Peças e insumos
openapi.part.create=Cadastra uma peça ou insumo
openapi.part.createDescription=O item nasce com estoque zero: a quantidade em estoque só muda por movimentação de estoque.
openapi.part.list=Lista as peças e insumos, ordenados por nome
openapi.part.findById=Busca uma peça ou insumo
openapi.part.update=Atualiza os dados de uma peça ou insumo
openapi.part.updateDescription=A quantidade em estoque não muda: um stockQuantity no corpo é ignorado, porque o estoque só muda por movimentação de estoque. O novo preço vale só para os próximos orçamentos.
openapi.part.delete=Exclui uma peça ou insumo
openapi.part.deleteDescription=Peça ou insumo com movimentações de estoque ou ordens de serviço ligadas não pode ser excluído (409).
openapi.part.id=Id da peça ou insumo
openapi.part.sku=Código (SKU), único. Até 50 letras, números, ponto, hífen, sublinhado ou barra, devolvido em maiúsculas
openapi.part.name=Nome da peça ou insumo
openapi.part.type=Tipo: PART (peça) ou SUPPLY (insumo)
openapi.part.unit=Unidade de medida: UNIT (unidade), LITER (litro) ou KG (quilograma)
openapi.part.salePrice=Preço de venda, zero ou positivo e com até duas casas decimais
openapi.part.stockQuantity=Quantidade em estoque. Só muda por movimentação de estoque
openapi.part.minimumStock=Estoque mínimo, zero ou positivo
openapi.part.nameFilter=Devolve só os itens cujo nome contém este texto, sem diferenciar maiúsculas
openapi.part.skuFilter=Devolve só o item com este SKU, sem diferenciar maiúsculas
openapi.part.typeFilter=Devolve só as peças (PART) ou só os insumos (SUPPLY)

# Stock movement
openapi.stockMovement.tag=Movimentações de estoque
openapi.stockMovement.create=Registra uma entrada ou um ajuste de estoque
openapi.stockMovement.createDescription=IN soma a quantidade ao estoque. ADJUSTMENT subtrai a quantidade (perda, avaria ou correção de contagem) e exige o motivo. OUT não é aceito aqui: a saída acontece na aprovação do orçamento da OS. O estoque nunca fica negativo (422).
openapi.stockMovement.list=Lista o histórico de movimentações de uma peça ou insumo, da mais recente para a mais antiga
openapi.stockMovement.id=Id da movimentação
openapi.stockMovement.requestType=Tipo: IN (entrada) ou ADJUSTMENT (ajuste, que subtrai do estoque)
openapi.stockMovement.type=Tipo: IN (entrada), OUT (saída por OS) ou ADJUSTMENT (ajuste, que subtrai do estoque)
openapi.stockMovement.quantity=Quantidade movimentada, maior que zero
openapi.stockMovement.reason=Motivo da movimentação, até 255 caracteres. Na entrada, opcional (ex.: número da nota fiscal); no ajuste, obrigatório e explica a saída (ex.: avaria, perda, correção de contagem)
openapi.stockMovement.serviceOrderId=Id da ordem de serviço, preenchido nas saídas por OS
openapi.stockMovement.createdBy=Id do usuário que registrou a movimentação
openapi.stockMovement.dateCreated=Data e hora da movimentação (ISO-8601, UTC)
