openapi.part.tag=Peças e insumos
openapi.part.create=Cadastra uma peça ou insumo
openapi.part.createDescription=O item nasce com estoque zero: a quantidade em estoque só muda por movimentação de estoque.
openapi.part.list=Lista as peças e insumos, ordenados por nome
openapi.part.findById=Busca uma peça ou insumo
openapi.part.update=Atualiza os dados de uma peça ou insumo
openapi.part.updateDescription=A quantidade em estoque não muda: um stockQuantity no corpo é ignorado, porque o estoque só muda por movimentação de estoque. O novo preço vale só para os próximos orçamentos.
openapi.part.delete=Exclui uma peça ou insumo
openapi.part.deleteDescription=Peça ou insumo com movimentações de estoque ou ordens de serviço ligadas não pode ser excluído (409).
openapi.part.id=Id da peça ou insumo
openapi.part.sku=Código (SKU), único. Até 50 letras, números, ponto, hífen, sublinhado ou barra, devolvido em maiúsculas
openapi.part.name=Nome da peça ou insumo
openapi.part.type=Tipo: PART (peça) ou SUPPLY (insumo)
openapi.part.unit=Unidade de medida: UNIT (unidade), LITER (litro) ou KG (quilograma)
openapi.part.salePrice=Preço de venda, zero ou positivo e com até duas casas decimais
openapi.part.stockQuantity=Quantidade em estoque. Só muda por movimentação de estoque
openapi.part.minimumStock=Estoque mínimo, zero ou positivo
openapi.part.nameFilter=Devolve só os itens cujo nome contém este texto, sem diferenciar maiúsculas
openapi.part.skuFilter=Devolve só o item com este SKU, sem diferenciar maiúsculas
openapi.part.typeFilter=Devolve só as peças (PART) ou só os insumos (SUPPLY)
openapi.part.lowStock=Lista as peças e insumos que precisam de reposição, ordenados por nome
openapi.part.lowStockDescription=Devolve os itens com quantidade em estoque menor ou igual ao estoque mínimo.

# Stock movement
openapi.stockMovement.tag=Movimentações de estoque
openapi.stockMovement.create=Registra uma entrada ou um ajuste de estoque
openapi.stockMovement.createDescription=IN soma a quantidade ao estoque. ADJUSTMENT subtrai a quantidade (perda, avaria ou correção de contagem) e exige o motivo. OUT não é aceito aqui: a saída acontece na aprovação do orçamento da OS. O estoque nunca fica negativo (422).
openapi.stockMovement.list=Lista o histórico de movimentações de uma peça ou insumo, da mais recente para a mais antiga
openapi.stockMovement.id=Id da movimentação
openapi.stockMovement.requestType=Tipo: IN (entrada) ou ADJUSTMENT (ajuste, que subtrai do estoque)
openapi.stockMovement.type=Tipo: IN (entrada), OUT (saída por OS) ou ADJUSTMENT (ajuste, que subtrai do estoque)
openapi.stockMovement.quantity=Quantidade movimentada, maior que zero
openapi.stockMovement.reason=Motivo da movimentação, até 255 caracteres. Na entrada, opcional (ex.: número da nota fiscal); no ajuste, obrigatório e explica a saída (ex.: avaria, perda, correção de contagem)
openapi.stockMovement.serviceOrderId=Id da ordem de serviço, preenchido nas saídas por OS
openapi.stockMovement.createdByUserId=Id do usuário que registrou a movimentação. Nulo na saída por OS quando o próprio cliente aprovou o orçamento
openapi.stockMovement.dateCreated=Data e hora da movimentação (ISO-8601, UTC)

# Ordens de serviço
openapi.serviceOrder.tag=Ordens de serviço
openapi.serviceOrder.open=Abre uma ordem de serviço a partir do CPF/CNPJ do cliente e da placa
openapi.serviceOrder.openDescription=O cliente precisa estar cadastrado (404). Se a placa já for do cliente, a OS usa o veículo cadastrado e os outros dados do veículo são ignorados; se a placa não existir, o veículo é cadastrado para o cliente; se for de outro cliente, 409. A OS nasce com status RECEIVED e sem itens. Repasse o publicId ao cliente para ele acompanhar a OS.
openapi.serviceOrder.customerDocument=CPF ou CNPJ do cliente, com ou sem pontuação
openapi.serviceOrder.vehicle=Veículo da OS
openapi.serviceOrder.problemDescription=Problema relatado pelo cliente, até 2000 caracteres
openapi.serviceOrder.id=Id da ordem de serviço
openapi.serviceOrder.publicId=Identificador público que o cliente usa para acompanhar a OS
openapi.serviceOrder.number=Número legível da OS, no formato SO-<ano>-<sequência>. A sequência recomeça a cada ano
openapi.serviceOrder.customerId=Id do cliente
openapi.serviceOrder.vehicleId=Id do veículo
openapi.serviceOrder.mechanicId=Id do mecânico responsável, definido ao iniciar o diagnóstico
openapi.serviceOrder.status=Status: RECEIVED, IN_DIAGNOSIS, AWAITING_APPROVAL, QUOTE_APPROVED, QUOTE_REJECTED, IN_PROGRESS, COMPLETED, DELIVERED ou CANCELED
openapi.serviceOrder.totalPrice=Valor total do orçamento, calculado pelo sistema somando o total de serviços e o de peças. Não pode ser alterado manualmente
openapi.serviceOrder.services=Serviços da OS, com o subtotal de cada item
openapi.serviceOrder.parts=Peças e insumos da OS, com o subtotal de cada item
openapi.serviceOrder.servicesTotal=Soma dos subtotais dos serviços
openapi.serviceOrder.partsTotal=Soma dos subtotais das peças e insumos
openapi.serviceOrder.startDiagnosis=Inicia o diagnóstico da OS
openapi.serviceOrder.startDiagnosisDescription=Move a OS de RECEIVED para IN_DIAGNOSIS e registra o usuário logado como mecânico responsável. Em qualquer outro status, 422.
openapi.serviceOrder.sendQuote=Envia o orçamento da OS para aprovação do cliente
openapi.serviceOrder.sendQuoteDescription=Move a OS de IN_DIAGNOSIS para AWAITING_APPROVAL e registra o envio e o usuário logado no histórico de status. A partir daí, os itens não podem mais ser incluídos nem removidos. Orçamento sem nenhum serviço ou peça, ou OS em qualquer outro status, 422.
openapi.serviceOrder.approveQuote=Registra a aprovação do orçamento e baixa o estoque das peças
openapi.serviceOrder.approveQuoteDescription=Para aprovações recebidas por telefone ou no balcão. Move a OS de AWAITING_APPROVAL para QUOTE_APPROVED, registra o usuário logado no histórico e baixa do estoque todas as peças da OS na mesma transação. Se faltar estoque de qualquer peça, nada é alterado e a resposta (422) diz qual peça faltou. Em qualquer outro status, 422. O início da execução é uma ação separada.
openapi.serviceOrder.rejectQuote=Registra a rejeição do orçamento
openapi.serviceOrder.rejectQuoteDescription=Move a OS de AWAITING_APPROVAL para QUOTE_REJECTED e grava o motivo e o usuário logado no histórico de status. O estoque não é alterado. Sem motivo, 400; em qualquer outro status, 422.
openapi.serviceOrder.rejectionReason=Motivo da rejeição informado pelo cliente, até 2000 caracteres
openapi.serviceOrder.reopenQuote=Reabre um orçamento rejeitado para montar um novo
openapi.serviceOrder.reopenQuoteDescription=Só para administradores. Move a OS de QUOTE_REJECTED para IN_DIAGNOSIS, liberando de novo a inclusão e a remoção de itens, e grava a descrição no histórico de status. Em qualquer outro status, 422.
openapi.serviceOrder.reopenDescription=Descrição opcional gravada no histórico, até 2000 caracteres
openapi.serviceOrder.dateCreated=Data e hora de abertura (ISO-8601, UTC)
openapi.serviceOrder.cancel=Cancela uma ordem de serviço
openapi.serviceOrder.cancelDescription=Move a OS para CANCELED e registra o motivo e o usuário logado no histórico de status. Só a partir de RECEIVED, IN_DIAGNOSIS, AWAITING_APPROVAL ou QUOTE_REJECTED: depois da aprovação do orçamento, ou numa OS já cancelada, 422.
openapi.serviceOrder.cancelReason=Motivo do cancelamento, até 2000 caracteres
openapi.serviceOrder.list=Lista as ordens de serviço, sem os itens
openapi.serviceOrder.listDescription=As OS em andamento vêm primeiro, das mais antigas para as mais novas, para priorizar o atendimento; as entregues (DELIVERED) e as canceladas (CANCELED) vêm depois, na mesma ordem. Os filtros são combinados entre si. CPF/CNPJ ou placa sem cadastro devolvem uma página vazia.
openapi.serviceOrder.statusFilter=Devolve só as OS com este status
openapi.serviceOrder.customerDocumentFilter=Devolve só as OS do cliente com este CPF ou CNPJ, com ou sem máscara
openapi.serviceOrder.licensePlateFilter=Devolve só as OS do veículo com esta placa, com ou sem hífen
openapi.serviceOrder.openedFromFilter=Devolve só as OS abertas a partir deste momento, inclusive (ISO-8601 com fuso, ex.: 2026-10-01T00:00:00-03:00)
openapi.serviceOrder.openedToFilter=Devolve só as OS abertas até este momento, inclusive (ISO-8601 com fuso, ex.: 2026-10-31T23:59:59-03:00)
openapi.serviceOrder.findById=Busca uma ordem de serviço completa
openapi.serviceOrder.findByIdDescription=Devolve a OS com os serviços, as peças, os totais do orçamento e o histórico de status, com a data e hora de cada mudança.
openapi.serviceOrder.statusHistory=Histórico de status, do mais antigo para o mais recente
openapi.serviceOrder.statusChange.fromStatus=Status anterior; nulo na abertura da OS
openapi.serviceOrder.statusChange.toStatus=Novo status
openapi.serviceOrder.statusChange.changedByUserId=Id do usuário que fez a mudança; nulo quando não havia usuário logado
openapi.serviceOrder.statusChange.description=Descrição ou motivo registrado na mudança
openapi.serviceOrder.statusChange.changedAt=Data e hora da mudança (ISO-8601, UTC)
openapi.serviceOrder.startExecution=Inicia a execução do serviço
openapi.serviceOrder.startExecutionDescription=Move a OS de QUOTE_APPROVED para IN_PROGRESS e registra o início da execução e o usuário logado no histórico de status. Em qualquer outro status, 422.
openapi.serviceOrder.completeService=Conclui um serviço da OS
openapi.serviceOrder.completeServiceDescription=Registra a data de conclusão e o usuário logado no serviço. Quando o último serviço é concluído, a OS passa automaticamente de IN_PROGRESS para COMPLETED. Só enquanto a OS está IN_PROGRESS e só uma vez por serviço (422).
openapi.serviceOrder.complete=Finaliza uma OS sem serviços pendentes
openapi.serviceOrder.completeDescription=Move a OS de IN_PROGRESS para COMPLETED e registra o fim da execução e o usuário logado no histórico de status. Uma OS com serviços é finalizada automaticamente ao concluir o último deles, então esta ação serve para OS só com peças. Com algum serviço pendente, ou em qualquer outro status, 422.
openapi.serviceOrder.deliver=Registra a entrega do veículo ao cliente
openapi.serviceOrder.deliverDescription=Move a OS de COMPLETED para DELIVERED e registra o usuário logado no histórico de status. Em qualquer outro status, 422.

# Itens da ordem de serviço
openapi.serviceOrderItem.addService=Inclui um serviço do catálogo na OS
openapi.serviceOrderItem.addServiceDescription=O preço da mão de obra é copiado do catálogo no momento da inclusão, e mudanças futuras de preço não alteram a OS. Só entra serviço ativo, só enquanto a OS está RECEIVED ou IN_DIAGNOSIS e só se o total da OS continuar até 9.999.999.999,99 (422 nos três casos).
openapi.serviceOrderItem.removeService=Remove um serviço da OS
openapi.serviceOrderItem.addPart=Inclui uma peça ou um insumo na OS
openapi.serviceOrderItem.addPartDescription=O preço de venda é copiado do estoque no momento da inclusão. O estoque não é baixado aqui, só na aprovação do orçamento: se o saldo atual não cobrir a quantidade desta peça somada em todos os itens da OS, o item entra mesmo assim e a resposta traz insufficientStock = true. Só enquanto a OS está RECEIVED ou IN_DIAGNOSIS e só se o total continuar até 9.999.999.999,99 (422).
openapi.serviceOrderItem.removePart=Remove uma peça ou um insumo da OS
openapi.serviceOrderItem.removeDescription=Só enquanto a OS está RECEIVED ou IN_DIAGNOSIS (422). O total da OS é recalculado.
openapi.serviceOrderItem.itemId=Id do item na OS
openapi.serviceOrderItem.serviceOfferingId=Id do serviço do catálogo
openapi.serviceOrderItem.partId=Id da peça ou do insumo
openapi.serviceOrderItem.quantity=Quantidade, de 1 a 999
openapi.serviceOrderItem.unitPrice=Preço unitário copiado no momento da inclusão
openapi.serviceOrderItem.subtotal=Preço unitário vezes a quantidade
openapi.serviceOrderItem.completedAt=Data e hora de conclusão do serviço (ISO-8601, UTC), ou null enquanto pendente
openapi.serviceOrderItem.serviceOrderTotalPrice=Novo total da OS, somando todos os itens
openapi.serviceOrderItem.availableQuantity=Saldo atual da peça em estoque
openapi.serviceOrderItem.insufficientStock=Se o saldo atual não cobre a quantidade desta peça somada em todos os itens da OS

# Acompanhamento da OS pelo cliente
openapi.customerServiceOrder.tag=Acompanhamento da OS pelo cliente
openapi.customerServiceOrder.customerDocument=CPF ou CNPJ do cliente dono da OS, com ou sem pontuação. Junto com o publicId, é o que dá acesso à OS
openapi.customerServiceOrder.track=Mostra a OS ao cliente
openapi.customerServiceOrder.trackDescription=Rota pública, sem token: o cliente se identifica pelo publicId da OS e pelo CPF/CNPJ no header X-Customer-Document. Se a OS não existir ou o documento não for do dono dela, a resposta é a mesma: 404. Traz o status, o histórico de status, o veículo e o orçamento detalhado. O orçamento só vem depois de enviado (a partir de AWAITING_APPROVAL); enquanto a OS está RECEIVED, IN_DIAGNOSIS ou CANCELED, quote é null.
openapi.customerServiceOrder.problemDescription=Problema relatado na abertura da OS
openapi.customerServiceOrder.statusHistory=Mudanças de status da OS, da mais antiga para a mais recente
openapi.customerServiceOrder.statusChangeStatus=Status para o qual a OS foi
openapi.customerServiceOrder.statusChangeDescription=Descrição registrada na mudança, como o motivo da rejeição ou do cancelamento
openapi.customerServiceOrder.statusChangeDate=Data e hora da mudança (ISO-8601, UTC)
openapi.customerServiceOrder.quote=Orçamento detalhado. Null até o orçamento ser enviado e quando a OS volta para diagnóstico ou é cancelada
openapi.customerServiceOrder.quoteServices=Serviços do orçamento
openapi.customerServiceOrder.quoteParts=Peças e insumos do orçamento
openapi.customerServiceOrder.quoteItemName=Nome do serviço ou da peça
openapi.customerServiceOrder.quoteTotalPrice=Valor total do orçamento, somando serviços e peças
