<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
    <h1 th:fragment="heading(text)"
        style="margin:20px 0 12px;font-size:22px;line-height:30px;color:#1f2a44;"
        th:text="${text}">Título</h1>

    <p th:fragment="paragraph(text)"
       style="margin:0;font-size:15px;line-height:24px;color:#374151;"
       th:text="${text}">Texto</p>

    <table th:fragment="details(rows)" role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="margin:24px 0;border:1px solid #e3e6eb;border-radius:8px;border-collapse:separate;">
        <tr th:each="row : ${rows}">
            <td style="padding:12px 16px;border-bottom:1px solid #e3e6eb;font-size:13px;color:#6b7280;width:35%;"
                th:text="${row[0]}">Rótulo</td>
            <td style="padding:12px 16px;border-bottom:1px solid #e3e6eb;font-size:14px;font-weight:bold;
                       color:#1f2a44;word-break:break-word;"
                th:text="${row[1]}">Valor</td>
        </tr>
    </table>

    <p th:fragment="nextStep(text)"
       style="margin:0;padding:16px;background-color:#f7f8fa;border-left:4px solid #1f2a44;border-radius:4px;
              font-size:14px;line-height:22px;color:#1f2a44;"
       th:text="${text}">Próximo passo</p>
</body>
</html>
