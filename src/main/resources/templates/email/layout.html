<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:fragment="layout(accent, badge, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">Assunto</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f3f6;font-family:Arial,Helvetica,sans-serif;color:#1f2a44;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f3f6;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;
                          box-shadow:0 2px 8px rgba(31,42,68,0.08);">
                <tr>
                    <td style="background-color:#1f2a44;padding:24px 32px;">
                        <span style="font-size:20px;font-weight:bold;color:#ffffff;letter-spacing:0.5px;"
                              th:text="#{notification.email.brand}">ArkTech Oficina</span>
                    </td>
                </tr>
                <tr>
                    <td th:style="'height:4px;background-color:' + ${accent} + ';'" style="height:4px;"></td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <span th:style="'display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;'
                                      + 'font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;color:#ffffff;'
                                      + 'background-color:' + ${accent} + ';'"
                              th:text="${badge}">Status</span>
                        <th:block th:replace="${content}"></th:block>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px;background-color:#f7f8fa;border-top:1px solid #e3e6eb;
                               font-size:12px;line-height:18px;color:#6b7280;"
                        th:text="#{notification.email.footer}">Rodapé</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
