<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{email/layout :: layout('#b7791f', #{notification.email.serviceOrderQuoteSent.badge}, ~{::content})}">
<body>
<th:block th:fragment="content">
    <h1 th:replace="~{email/components :: heading(#{notification.email.serviceOrderQuoteSent.heading})}"></h1>
    <p th:replace="~{email/components :: paragraph(#{notification.email.serviceOrderQuoteSent.intro})}"></p>
    <table th:replace="~{email/components :: details(${ {{#messages.msg('notification.email.label.serviceOrder'), parameters[0]}, {#messages.msg('notification.email.label.totalPrice'), parameters[1]}} })}"></table>
    <p th:replace="~{email/components :: nextStep(#{notification.email.serviceOrderQuoteSent.nextStep})}"></p>
</th:block>
</body>
</html>
