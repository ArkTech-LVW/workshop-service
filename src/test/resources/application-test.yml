spring:
  jpa:
    properties:
      hibernate:
        generate_statistics: true

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn

security:
  rate-limit:
    general:
      capacity: 10000
    login-per-email-and-ip:
      capacity: 10000
    routes:
      login:
        capacity: 10000
      customer-service-orders:
        capacity: 10000
